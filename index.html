<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg,#FF2DAA, #A855F7, #2563EB);
        }

        .calculator {
            width: 350px;
            padding: 20px;
            border-radius: 25px;
            background: #171717;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .display {
            width: 100%;
            height: 90px;
            border: none;
            outline: none;
            border-radius: 15px;
            background: #252525;
            color: white;
            font-size: 38px;
            text-align: right;
            padding: 15px;
            margin-bottom: 20px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 65px;
            border: none;
            border-radius: 15px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            background: #333;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            background: #444;
        }

        button:active {
            transform: scale(0.95);
        }

        .operator {
            background: #ff9500;
        }

        .operator:hover {
            background: #ffad32;
        }

        .clear {
            background: #e74c3c;
        }

        .clear:hover {
            background: #ff5b4d;
        }

        .equal {
            background: #2ecc71;
            grid-row: span 2;
            height: 70px;
        }

        .equal:hover {
            background: #40df82;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <input type="text" id="display" class="display" value="0" readonly>

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">AC</button>
            <button onclick="deleteLast()">DEL</button>
            <button onclick="percentage()">%</button>
            <button class="operator" onclick="addOperator('/')">÷</button>

            <button onclick="addNumber('7')">7</button>
            <button onclick="addNumber('8')">8</button>
            <button onclick="addNumber('9')">9</button>
            <button class="operator" onclick="addOperator('*')">×</button>

            <button onclick="addNumber('4')">4</button>
            <button onclick="addNumber('5')">5</button>
            <button onclick="addNumber('6')">6</button>
            <button class="operator" onclick="addOperator('-')">−</button>

            <button onclick="addNumber('1')">1</button>
            <button onclick="addNumber('2')">2</button>
            <button onclick="addNumber('3')">3</button>
            <button class="operator" onclick="addOperator('+')">+</button>

            <button class="zero" onclick="addNumber('0')">0</button>
            <button onclick="addNumber('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>

        </div>
    </div>


    <script>

        let display = document.getElementById("display");

        // Number add karna
        function addNumber(number) {

            if (display.value === "0") {
                display.value = number;
            } 
            else {
                display.value += number;
            }
        }


        // Operator add karna
        function addOperator(operator) {

            let lastCharacter =
                display.value.charAt(display.value.length - 1);

            if ("+-*/".includes(lastCharacter)) {
                return;
            }

            display.value += operator;
        }


        // Calculator clear karna
        function clearDisplay() {
            display.value = "0";
        }


        // Last character delete karna
        function deleteLast() {

            if (display.value.length === 1) {
                display.value = "0";
            } 
            else {
                display.value =
                    display.value.slice(0, -1);
            }
        }


        // Percentage calculate karna
        function percentage() {

            try {
                display.value =
                    eval(display.value) / 100;
            } 
            catch {
                display.value = "Error";
            }
        }


        // Calculation
        function calculate() {

            try {

                let expression = display.value;

                let result = eval(expression);

                if (result === Infinity ||
                    result === -Infinity) {

                    display.value = "Error";

                } 
                else {

                    display.value = result;

                }

            } 
            catch {

                display.value = "Error";

            }
        }


        // Keyboard support
        document.addEventListener("keydown", function(event) {

            let key = event.key;

            if (!isNaN(key) || key === ".") {
                addNumber(key);
            }

            else if ("+-*/".includes(key)) {
                addOperator(key);
            }

            else if (key === "Enter" || key === "=") {
                calculate();
            }

            else if (key === "Backspace") {
                deleteLast();
            }

            else if (key === "Escape") {
                clearDisplay();
            }

            else if (key === "%") {
                percentage();
            }

        });

    </script>

</body>
</html>
